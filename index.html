<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tito y los cambios de la cueva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #FAF7F0;
      --primary: #1B4A38;
      --accent: #B4731E;
      --coral: #D95340;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Ambient soft background */
    .ambient-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.8) 0%, rgba(250, 247, 240, 1) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Minimal floating top controls */
    .top-bar {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(215, 200, 170, 0.6);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      cursor: pointer;
      color: var(--primary);
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      transform: scale(1.08);
      background: #FFFFFF;
      box-shadow: 0 6px 18px rgba(27, 74, 56, 0.15);
    }

    .icon-btn.playing {
      animation: music-spin 6s linear infinite;
    }

    @keyframes music-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Main Story Stage - Full viewport priority */
    .book-stage {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    /* 16:9 Responsive Slide Canvas */
    .slide-frame {
      position: relative;
      width: min(96vw, calc(92vh * (16 / 9)));
      height: min(calc(96vw * (9 / 16)), 88vh);
      max-width: 1500px;
      aspect-ratio: 16 / 9;
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 16px 45px rgba(27, 74, 56, 0.1), 0 2px 10px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(215, 200, 170, 0.45);
    }

    .slide-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: none;
      pointer-events: none;
    }

    .slide-canvas.active {
      display: block;
      pointer-events: auto;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Navigation Arrows */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(215, 200, 170, 0.7);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: var(--primary);
      cursor: pointer;
      z-index: 30;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .nav-arrow:hover:not(:disabled) {
      background: var(--primary);
      color: #FFFFFF;
      transform: translateY(-50%) scale(1.1);
    }

    .nav-arrow:disabled {
      opacity: 0.15;
      cursor: default;
      pointer-events: none;
    }

    .nav-arrow.prev { left: 16px; }
    .nav-arrow.next { right: 16px; }

    /* Minimal floating Sound Action Button */
    .sound-badge-dock {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .sound-badge {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid var(--accent);
      color: #633C02;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 10px 24px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(180, 115, 30, 0.22);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      animation: sound-glow 2.2s infinite;
      white-space: nowrap;
    }

    .sound-badge:hover {
      background: var(--accent);
      color: #FFFFFF;
      transform: scale(1.06);
    }

    .sound-badge.btn-laughter {
      border-color: #2E8B57;
      color: #155734;
      box-shadow: 0 8px 24px rgba(46, 139, 87, 0.25);
    }
    .sound-badge.btn-laughter:hover {
      background: #2E8B57;
      color: #FFF;
    }

    .sound-badge.btn-door {
      border-color: var(--coral);
      color: #932214;
      box-shadow: 0 8px 24px rgba(217, 83, 64, 0.25);
    }
    .sound-badge.btn-door:hover {
      background: var(--coral);
      color: #FFF;
    }

    .sound-badge.btn-heart {
      border-color: #C2185B;
      color: #880E4F;
      box-shadow: 0 8px 24px rgba(194, 24, 91, 0.25);
    }
    .sound-badge.btn-heart:hover {
      background: #C2185B;
      color: #FFF;
    }

    .sound-badge.btn-calm {
      border-color: #0288D1;
      color: #01579B;
      box-shadow: 0 8px 24px rgba(2, 136, 209, 0.25);
    }
    .sound-badge.btn-calm:hover {
      background: #0288D1;
      color: #FFF;
    }

    @keyframes sound-glow {
      0% { transform: scale(1); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
      50% { transform: scale(1.04); box-shadow: 0 8px 28px rgba(0,0,0,0.22); }
      100% { transform: scale(1); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    }

    /* Minimal Bottom Dots (Subtle) */
    .minimal-dots {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 7px;
      z-index: 30;
      padding: 4px 12px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      border: 1px solid rgba(215, 200, 170, 0.4);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(27, 74, 56, 0.25);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .dot.active {
      width: 22px;
      border-radius: 10px;
      background: var(--primary);
    }

    /* Sound Wave Ripple Effect */
    .sound-ripple {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid var(--accent);
      opacity: 0;
      pointer-events: none;
      z-index: 99;
    }

    .sound-ripple.animate {
      animation: rippleEffect 0.7s ease-out forwards;
    }

    @keyframes rippleEffect {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(3.5); opacity: 0; }
    }

    /* Mobile Adaptations */
    @media (max-width: 768px) {
      .book-stage {
        padding: 6px;
      }
      .slide-frame {
        width: 98vw;
        height: min(calc(98vw * (9 / 16)), 80vh);
        border-radius: 14px;
      }
      .nav-arrow {
        width: 42px;
        height: 42px;
        font-size: 1.3rem;
      }
      .nav-arrow.prev { left: 8px; }
      .nav-arrow.next { right: 8px; }
      .sound-badge {
        font-size: 0.88rem;
        padding: 8px 18px;
      }
      .sound-badge-dock {
        bottom: 34px;
      }
      .top-bar {
        top: 10px;
        right: 12px;
      }
      .icon-btn {
        width: 38px;
        height: 38px;
        font-size: 1.1rem;
      }
    }

    /* Landscape Mode for Phone (Maximized Experience) */
    @media (max-height: 500px) {
      .slide-frame {
        width: calc(94vh * (16 / 9));
        height: 94vh;
        border-radius: 12px;
      }
      .sound-badge-dock {
        bottom: 22px;
      }
      .sound-badge {
        font-size: 0.78rem;
        padding: 5px 14px;
      }
      .minimal-dots {
        bottom: 4px;
      }
      .nav-arrow {
        width: 36px;
        height: 36px;
        font-size: 1.1rem;
      }
      .top-bar {
        top: 6px;
        right: 8px;
      }
      .icon-btn {
        width: 34px;
        height: 34px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Background -->
  <div class="ambient-bg"></div>

  <!-- Ripple Sound Effect Ring -->
  <div id="sound-ripple" class="sound-ripple"></div>

  <!-- Minimal Floating Audio & Fullscreen Buttons -->
  <div class="top-bar">
    <button id="btn-music" class="icon-btn" title="Música de Cuna (Activar/Silenciar)">
      🎵
    </button>
    <button id="btn-fullscreen" class="icon-btn" title="Pantalla Completa">
      ⛶
    </button>
  </div>

  <!-- Audio Elements -->
  <audio id="audio-bgm" loop preload="auto">
    <source src="assets/audio/musica_de_fondo_bebes.mp3" type="audio/mpeg">
  </audio>
  <audio id="audio-laughter" preload="auto">
    <source src="assets/audio/sonido_risita_ji_ji_ji.mp3" type="audio/mpeg">
  </audio>
  <audio id="audio-door" preload="auto">
    <source src="assets/audio/sonido_puerta_clanc_clanc.mp3" type="audio/mpeg">
  </audio>
  <audio id="audio-heart" preload="auto">
    <source src="assets/audio/sonido_corazon_pum_pum.mp3" type="audio/mpeg">
  </audio>

  <!-- Main Story Stage -->
  <main class="book-stage">

    <!-- Left Navigation Arrow -->
    <button id="btn-prev" class="nav-arrow prev" title="Anterior" disabled>‹</button>

    <!-- Slide Canvas Frame -->
    <div id="slide-viewport" class="slide-frame" title="Toca para avanzar">
      <img id="slide-1" class="slide-canvas active" src="assets/images/slide_01.png" alt="1. Portada">
      <img id="slide-2" class="slide-canvas" src="assets/images/slide_02.png" alt="2. La cueva grande">
      <img id="slide-3" class="slide-canvas" src="assets/images/slide_03.png" alt="3. Mañana tibia">
      <img id="slide-4" class="slide-canvas" src="assets/images/slide_04.png" alt="4. Tito ríe">
      <img id="slide-5" class="slide-canvas" src="assets/images/slide_05.png" alt="5. El portazo">
      <img id="slide-6" class="slide-canvas" src="assets/images/slide_06.png" alt="6. El corazón asustado">
      <img id="slide-7" class="slide-canvas" src="assets/images/slide_07.png" alt="7. Mamá abraza">
      <img id="slide-8" class="slide-canvas" src="assets/images/slide_08.png" alt="8. Tristeza en la pancita">
      <img id="slide-9" class="slide-canvas" src="assets/images/slide_09.png" alt="9. Osa Rosa acompaña">
      <img id="slide-10" class="slide-canvas" src="assets/images/slide_10.png" alt="10. Todo está bien">
    </div>

    <!-- Right Navigation Arrow -->
    <button id="btn-next" class="nav-arrow next" title="Siguiente">›</button>

    <!-- Contextual Sound Badge Dock (Minimal floating action per slide) -->
    <div id="sound-dock" class="sound-badge-dock"></div>

    <!-- Minimal Dots Indicator -->
    <div class="minimal-dots" id="dots-container">
      <div class="dot active" data-page="1"></div>
      <div class="dot" data-page="2"></div>
      <div class="dot" data-page="3"></div>
      <div class="dot" data-page="4"></div>
      <div class="dot" data-page="5"></div>
      <div class="dot" data-page="6"></div>
      <div class="dot" data-page="7"></div>
      <div class="dot" data-page="8"></div>
      <div class="dot" data-page="9"></div>
      <div class="dot" data-page="10"></div>
    </div>

  </main>

  <script>
    let currentPage = 1;
    const totalPages = 10;
    let isMusicPlaying = false;
    let audioCtx = null;

    // DOM References
    const audioBgm = document.getElementById('audio-bgm');
    const audioLaughter = document.getElementById('audio-laughter');
    const audioDoor = document.getElementById('audio-door');
    const audioHeart = document.getElementById('audio-heart');
    const btnMusic = document.getElementById('btn-music');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const slideViewport = document.getElementById('slide-viewport');
    const soundDock = document.getElementById('sound-dock');
    const dotsContainer = document.getElementById('dots-container');
    const rippleEl = document.getElementById('sound-ripple');
    const dots = document.querySelectorAll('.dot');

    // Slide Sound definitions
    const slideSounds = {
      4: {
        text: '😄 🔊 «¡ji, ji, ji!»',
        badgeClass: 'sound-badge btn-laughter',
        play: () => playSound('laughter')
      },
      5: {
        text: '🚪 🔊 «¡CLANC, CLANC!»',
        badgeClass: 'sound-badge btn-door',
        play: () => playSound('door')
      },
      6: {
        text: '💓 🔊 «¡PUM, PUM, PUM!»',
        badgeClass: 'sound-badge btn-heart',
        play: () => playSound('heart')
      },
      7: {
        text: '🤱 🔊 «Aquí estoy» (Calma)',
        badgeClass: 'sound-badge btn-calm',
        play: () => playSlowHeartbeat()
      },
      8: {
        text: '🍃 🔊 Sentir la pancita (Tristeza)',
        badgeClass: 'sound-badge',
        play: () => playSadnessBreathe()
      },
      9: {
        text: '✨ 🔊 «Yo estoy contigo»',
        badgeClass: 'sound-badge btn-calm',
        play: () => playCalmChime()
      },
      10: {
        text: '⭐ 🔊 «¡Y todo está bien!»',
        badgeClass: 'sound-badge btn-laughter',
        play: () => playCelebration()
      }
    };

    // Navigation function
    function goToPage(page) {
      if (page < 1) page = 1;
      if (page > totalPages) page = totalPages;
      currentPage = page;

      // Update active slide image
      for (let i = 1; i <= totalPages; i++) {
        const el = document.getElementById(`slide-${i}`);
        if (el) {
          if (i === currentPage) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        }
      }

      // Arrows disabled states
      btnPrev.disabled = (currentPage === 1);
      btnNext.disabled = (currentPage === totalPages);

      // Dots state
      dots.forEach((dot, idx) => {
        if (idx + 1 === currentPage) {
          dot.classList.add('active');
        } else {
          dot.classList.remove('active');
        }
      });

      // Update Sound Badge
      updateSoundBadge();
    }

    function updateSoundBadge() {
      soundDock.innerHTML = '';
      const data = slideSounds[currentPage];
      if (data) {
        const btn = document.createElement('button');
        btn.className = data.badgeClass;
        btn.innerHTML = data.text;
        btn.onclick = (e) => {
          e.stopPropagation();
          data.play();
          triggerRipple();
        };
        soundDock.appendChild(btn);
      }
    }

    // Ripple visual animation
    function triggerRipple() {
      rippleEl.classList.remove('animate');
      void rippleEl.offsetWidth;
      rippleEl.classList.add('animate');
    }

    // Audio Engine & Start
    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function startBackgroundMusic() {
      unlockAudio();
      audioBgm.volume = 0.35;
      audioBgm.play().then(() => {
        isMusicPlaying = true;
        btnMusic.textContent = '🎵';
        btnMusic.classList.add('playing');
      }).catch(err => {
        console.log('Autoplay prevented by browser:', err);
      });
    }

    function toggleMusic() {
      if (audioBgm.paused) {
        startBackgroundMusic();
      } else {
        audioBgm.pause();
        isMusicPlaying = false;
        btnMusic.textContent = '🔇';
        btnMusic.classList.remove('playing');
      }
    }

    btnMusic.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMusic();
    });

    // Sound effect playback
    function playSound(type) {
      unlockAudio();
      let el = null;
      if (type === 'laughter') el = audioLaughter;
      if (type === 'door') el = audioDoor;
      if (type === 'heart') el = audioHeart;
      if (el) {
        el.currentTime = 0;
        el.play().catch(e => console.log('Audio error:', e));
      }
      triggerRipple();
    }

    // Web Audio Synthesizer for gentle emotional tones
    function playSlowHeartbeat() {
      unlockAudio();
      const beats = [0, 0.45, 1.2, 1.7];
      beats.forEach(t => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(80, audioCtx.currentTime + t);
        osc.frequency.exponentialRampToValueAtTime(45, audioCtx.currentTime + t + 0.15);
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + t);
        osc.stop(audioCtx.currentTime + t + 0.3);
      });
      triggerRipple();
    }

    function playSadnessBreathe() {
      unlockAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(392, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(329.63, audioCtx.currentTime + 1.2);
      gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.4);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.6);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.7);
      triggerRipple();
    }

    function playCalmChime() {
      unlockAudio();
      const notes = [659.25, 783.99, 987.77, 1318.51];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        const start = audioCtx.currentTime + (idx * 0.15);
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.25, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 1.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 1.5);
      });
      triggerRipple();
    }

    function playCelebration() {
      unlockAudio();
      const chord = [523.25, 659.25, 783.99, 1046.50];
      chord.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        const start = audioCtx.currentTime + (idx * 0.1);
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.28, start + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 2.0);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 2.1);
      });
      triggerRipple();
    }

    // Page tap interaction: Tap right half to go forward, tap left half to go back
    slideViewport.addEventListener('click', (e) => {
      const rect = slideViewport.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX > rect.width * 0.4) {
        if (currentPage < totalPages) goToPage(currentPage + 1);
      } else {
        if (currentPage > 1) goToPage(currentPage - 1);
      }
    });

    btnPrev.addEventListener('click', (e) => {
      e.stopPropagation();
      goToPage(currentPage - 1);
    });

    btnNext.addEventListener('click', (e) => {
      e.stopPropagation();
      goToPage(currentPage + 1);
    });

    // Minimal dots click
    dots.forEach(dot => {
      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        const p = parseInt(dot.getAttribute('data-page'));
        goToPage(p);
      });
    });

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
        if (currentPage < totalPages) goToPage(currentPage + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'Backspace') {
        if (currentPage > 1) goToPage(currentPage - 1);
      } else if (e.key === 'm' || e.key === 'M') {
        toggleMusic();
      } else if (e.key === 'f' || e.key === 'F') {
        btnFullscreen.click();
      }
    });

    // Touch swipe support
    let touchStartX = 0;
    slideViewport.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    slideViewport.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      if (diffX < -45 && currentPage < totalPages) {
        goToPage(currentPage + 1);
      } else if (diffX > 45 && currentPage > 1) {
        goToPage(currentPage - 1);
      }
    }, { passive: true });

    // Fullscreen support
    btnFullscreen.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    // Autoplay Music Trigger:
    // 1. Inmediato apenas se abre la página
    window.addEventListener('DOMContentLoaded', () => {
      startBackgroundMusic();
    });

    // 2. Desbloqueo transparente al primer toque/clic en cualquier parte de la pantalla
    function unlockAudioOnFirstInteraction() {
      if (audioBgm.paused) {
        startBackgroundMusic();
      }
      window.removeEventListener('pointerdown', unlockAudioOnFirstInteraction);
      window.removeEventListener('touchstart', unlockAudioOnFirstInteraction);
      window.removeEventListener('click', unlockAudioOnFirstInteraction);
      window.removeEventListener('keydown', unlockAudioOnFirstInteraction);
    }

    window.addEventListener('pointerdown', unlockAudioOnFirstInteraction, { passive: true });
    window.addEventListener('touchstart', unlockAudioOnFirstInteraction, { passive: true });
    window.addEventListener('click', unlockAudioOnFirstInteraction, { passive: true });
    window.addEventListener('keydown', unlockAudioOnFirstInteraction, { passive: true });

    // Initial query param or start on page 1
    const urlParams = new URLSearchParams(window.location.search);
    const initialPage = parseInt(urlParams.get('page')) || 1;
    goToPage(initialPage);
  </script>
</body>
</html>
